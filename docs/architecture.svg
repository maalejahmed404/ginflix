<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- background (so it is readable in GitHub dark mode too) -->
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- browser -->
  <rect x="60" y="24" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Browser</text>

  <g font-size="13" fill="#334155">
    <text x="290" y="38"><tspan font-weight="600" fill="#0f172a">ginflix.localhost:8088</tspan>  public site, /api, /stream</text>
    <text x="290" y="58"><tspan font-weight="600" fill="#0f172a">admin.ginflix.localhost:8088</tspan>  admin site</text>
    <text x="290" y="78"><tspan font-weight="600" fill="#0f172a">auth.ginflix.localhost:8088</tspan>  login page</text>
  </g>

  <line x1="160" y1="80" x2="160" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- reverse proxy -->
  <rect x="60" y="124" width="830" height="52" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="475" y="147" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Caddy reverse proxy</text>
  <text x="475" y="166" text-anchor="middle" font-size="12" fill="#334155">docker container on the "kind" network, port 8088</text>

  <!-- cluster -->
  <rect x="30" y="232" width="900" height="384" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="48" y="604" font-size="13" font-weight="600" fill="#475569">kind cluster (1 control plane + 2 workers, Calico)  ·  namespace "ginflix"</text>

  <!-- proxy -> services (NodePort) -->
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="135" y1="176" x2="135" y2="288"/>
    <line x1="305" y1="176" x2="305" y2="288"/>
    <line x1="475" y1="176" x2="475" y2="288"/>
    <line x1="645" y1="176" x2="645" y2="288"/>
    <line x1="815" y1="176" x2="815" y2="288"/>
  </g>
  <g font-size="12" fill="#334155">
    <text x="143" y="200">/</text>
    <text x="313" y="200">admin.</text>
    <text x="483" y="200">auth.</text>
    <text x="653" y="200">/api</text>
    <text x="823" y="200">/stream</text>
  </g>
  <text x="24" y="222" font-size="12" font-style="italic" fill="#64748b">NodePort services</text>

  <!-- row 1: services reached from outside -->
  <g stroke-width="1.5">
    <rect x="60" y="290" width="150" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="230" y="290" width="150" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="400" y="290" width="150" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="570" y="290" width="150" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="740" y="290" width="150" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="135" y="318" font-size="15" font-weight="600">frontend</text>
    <text x="135" y="338" font-size="12" fill="#334155">Deployment ×2</text>

    <text x="305" y="318" font-size="15" font-weight="600">frontend-admin</text>
    <text x="305" y="338" font-size="12" fill="#334155">Deployment ×1</text>

    <text x="475" y="318" font-size="15" font-weight="600">keycloak</text>
    <text x="475" y="338" font-size="12" fill="#334155">Deployment ×1 · login</text>

    <text x="645" y="318" font-size="15" font-weight="600">backend</text>
    <text x="645" y="338" font-size="12" fill="#334155">Deployment ×1 · API</text>

    <text x="815" y="318" font-size="15" font-weight="600">streamer</text>
    <text x="815" y="338" font-size="12" fill="#334155">Deployment ×2 + HPA</text>
  </g>

  <!-- backend -> keycloak (public keys) -->
  <path d="M 645 354 L 645 384 L 475 384 L 475 357" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="401" text-anchor="middle" font-size="12" fill="#334155">public keys (JWKS)</text>

  <!-- backend -> mongodb, backend -> seaweedfs, streamer -> seaweedfs -->
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 690 354 L 690 420 L 600 420 L 600 468"/>
    <path d="M 705 354 L 705 420 L 770 420 L 770 468"/>
    <path d="M 830 354 L 830 468"/>
  </g>
  <g font-size="12" fill="#334155">
    <text x="606" y="446">metadata</text>
    <text x="712" y="446">write</text>
    <text x="838" y="446">read</text>
  </g>

  <!-- row 2: data -->
  <g stroke-width="1.5">
    <rect x="500" y="470" width="180" height="64" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <rect x="710" y="470" width="180" height="64" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="590" y="498" font-size="15" font-weight="600">mongodb</text>
    <text x="590" y="518" font-size="12" fill="#334155">StatefulSet ×3 · replica set rs0</text>

    <text x="800" y="498" font-size="15" font-weight="600">seaweedfs</text>
    <text x="800" y="518" font-size="12" fill="#334155">Deployment ×1 · S3 storage</text>
  </g>

  <!-- volumes -->
  <g stroke="#475569" stroke-width="1.5">
    <line x1="590" y1="534" x2="590" y2="556"/>
    <line x1="800" y1="534" x2="800" y2="556"/>
  </g>
  <g stroke="#ea580c" stroke-width="1.5" fill="#fff7ed">
    <rect x="530" y="556" width="120" height="30" rx="15"/>
    <rect x="740" y="556" width="120" height="30" rx="15"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#0f172a">
    <text x="590" y="576">3 PVC (1 per pod)</text>
    <text x="800" y="576">1 PVC</text>
  </g>

  <!-- notes -->
  <g font-size="12.5" fill="#334155">
    <text x="60" y="410" font-size="13" font-weight="600" fill="#0f172a">Also in the namespace</text>
    <text x="60" y="434">• Job mongo-init: runs rs.initiate() once</text>
    <text x="60" y="456">• Job s3-init: creates the bucket</text>
    <text x="60" y="478">• NetworkPolicies: default deny, then</text>
    <text x="72" y="496">mongodb accepts only the backend,</text>
    <text x="72" y="514">seaweedfs only backend and streamer</text>
    <text x="60" y="536">• mongodb and seaweedfs are ClusterIP</text>
    <text x="72" y="554">(not reachable from outside)</text>
  </g>
</svg>
