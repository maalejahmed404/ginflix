apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ginflix
  labels:
    app: backend
data:
  ENV: "production"
  # The app calls its S3 storage "Garage". Here it is SeaweedFS, in the
  # cluster, without TLS.
  GARAGE_ENDPOINT: "seaweedfs:8333"
  GARAGE_BUCKET: "ginflix"
  GARAGE_USE_SSL: "false"
  # The backend checks the signature of the login tokens with the public
  # keys of Keycloak. It gets them directly from the keycloak service.
  KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/ginflix/protocol/openid-connect/certs"
  KEYCLOAK_HOST: "auth.ginflix.localhost:8088"
  KEYCLOAK_REALM: "ginflix"
  # the backend only accepts the user whose name is the client id
  KEYCLOAK_CLIENT_ID: "ginflix"
  # the driver finds the primary by itself thanks to replicaSet=rs0
  MONGO_URI: "mongodb://mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/?replicaSet=rs0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ginflix
  labels:
    app: backend
spec:
  # Only 1 replica on purpose. When a video is uploaded the backend saves it
  # in its own /tmp and converts it (ffmpeg) in the background. With 2
  # replicas, a "process again" request can land on the other pod, which
  # does not have the file.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ginflix/backend
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: s3-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /api/videos reads from MongoDB, so the pod only becomes Ready
          # when the database is really usable
          readinessProbe:
            httpGet:
              path: /api/videos
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # high limits: uploads are kept in memory and ffmpeg is heavy
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # the root filesystem is read-only, uploads and ffmpeg output go here
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ginflix
  labels:
    app: backend
spec:
  # fixed nodePort because the reverse proxy config points to it
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
