apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubectl apply -k k8s

resources:
  - namespace.yaml
  - network-policies.yaml
  - mongodb.yaml
  - mongo-init-job.yaml
  - seaweedfs.yaml
  - keycloak.yaml
  - backend.yaml
  - streamer.yaml
  - frontend.yaml
  - frontend-admin.yaml

# the Keycloak realm (client + demo user) is a json file, kustomize
# turns it into a ConfigMap
configMapGenerator:
  - name: keycloak-realm
    namespace: ginflix
    files:
      - realm.json=keycloak-realm.json

# tag of the 4 images built by "make images"
images:
  - name: ginflix/backend
    newTag: "1.0.0"
  - name: ginflix/streamer
    newTag: "1.0.0"
  - name: ginflix/frontend
    newTag: "1.0.0"
  - name: ginflix/frontend-admin
    newTag: "1.0.0"
