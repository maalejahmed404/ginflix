# Headless service: no load balancing, each pod gets its own DNS name
# (mongodb-0.mongodb, mongodb-1.mongodb, mongodb-2.mongodb).
# The replica set members need these stable names to find each other.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: ginflix
  labels:
    app: mongodb
spec:
  clusterIP: None
  # members must resolve each other before they are Ready
  publishNotReadyAddresses: true
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: ginflix
  labels:
    app: mongodb
spec:
  serviceName: mongodb
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      automountServiceAccountToken: false
      # try to put the 3 members on different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: mongodb
      securityContext:
        # 999 is the mongodb user of the official image.
        # fsGroup makes the volume writable for it.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:6.0.14
          args:
            - --replSet=rs0
            - --bind_ip_all
            - --wiredTigerCacheSizeGB=0.25
          ports:
            - name: mongo
              containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
  # one PVC per pod: data-mongodb-0, data-mongodb-1, data-mongodb-2
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
